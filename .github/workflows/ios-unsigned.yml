name: iOS unsigned build test

on:
  workflow_dispatch:
    inputs:
      enable_login:
        description: Build with TraceFox login credentials and settings
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout pinned DarkGram source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nepcukk/Darkgram
          ref: e45952ec5f30338dc83989e5798c9c683298794c
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify build environment and source
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 ci/unsigned_build.py --source source --output artifacts --preflight-only 2>&1 | tee artifacts/preflight.log
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Test independent local archive storage
        run: |
          swiftc ci/TraceFoxArchiveStore.swift tests/archive-store-main.swift -o "$RUNNER_TEMP/archive-store-test"
          "$RUNNER_TEMP/archive-store-test"

      - name: Compile unsigned iPhone application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TRACEFOX_ENABLE_LOGIN: ${{ inputs.enable_login && '1' || '0' }}
          TRACEFOX_API_ID: ${{ secrets.TRACEFOX_API_ID }}
          TRACEFOX_API_HASH: ${{ secrets.TRACEFOX_API_HASH }}
          TRACEFOX_SERVER: ${{ vars.TRACEFOX_SERVER }}
          TRACEFOX_BOT: ${{ vars.TRACEFOX_BOT }}
        run: |
          set -euo pipefail
          python3 -u ci/unsigned_build.py --source source --output artifacts 2>&1 | tee artifacts/build.log

      - name: Remove credentials from diagnostic files
        id: sanitize
        if: always()
        env:
          TRACEFOX_API_ID: ${{ secrets.TRACEFOX_API_ID }}
          TRACEFOX_API_HASH: ${{ secrets.TRACEFOX_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for path in Path('artifacts').glob('*.log'):
              value = path.read_text(errors='replace')
              for key in ('TRACEFOX_API_ID', 'TRACEFOX_API_HASH'):
                  secret = os.environ.get(key)
                  if secret:
                      value = value.replace(secret, '[redacted]')
              path.write_text(value)
          PY

      - name: Upload diagnostic logs
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-build-diagnostics-${{ github.run_number }}
          path: |
            artifacts/*.log
            artifacts/environment.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified unsigned IPA
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: TraceFox-iOS-build-test-unsigned-${{ github.run_number }}
          path: |
            artifacts/TraceFox-iOS-build-test-unsigned.ipa
            artifacts/ipa-verification.json
          if-no-files-found: error
          retention-days: 7
