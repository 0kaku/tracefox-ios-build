name: TraceFox local archive storage tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-tests:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Parse staged native privacy sources
        run: |
          swiftc -frontend -parse ci/TraceFoxPrivacyControl.swift ci/TraceFoxPrivacyController.swift ci/TraceFoxArchiveController.swift ci/TraceFoxBotPairingController.swift
      - name: Test bot-link protocol boundaries without network access
        run: |
          swiftc ci/TraceFoxBotLinkProtocol.swift tests/bot-link-main.swift -o "$RUNNER_TEMP/bot-link-test"
          "$RUNNER_TEMP/bot-link-test"
      - name: Test cloud archive identity mapping without uploads
        run: |
          swiftc ci/TraceFoxCloudArchiveIdentity.swift ci/TraceFoxCloudArchivePayload.swift tests/cloud-identity-main.swift -o "$RUNNER_TEMP/cloud-identity-test"
          TRACEFOX_PAYLOAD_FIXTURE="$RUNNER_TEMP/cloud-payload-fixtures.json" "$RUNNER_TEMP/cloud-identity-test"
      - name: Upload synthetic Swift payloads for backend contract validation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cloud-payload-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/cloud-payload-fixtures.json
          retention-days: 7
          if-no-files-found: error
      - name: Test durable cloud event queue without network access
        run: |
          swiftc ci/TraceFoxCloudArchiveIdentity.swift ci/TraceFoxCloudArchivePayload.swift ci/TraceFoxCloudArchiveQueue.swift tests/cloud-queue-main.swift -o "$RUNNER_TEMP/cloud-queue-test"
          "$RUNNER_TEMP/cloud-queue-test"
      - name: Test account-scoped Keychain with synthetic credentials
        run: |
          swiftc ci/TraceFoxBotLinkProtocol.swift ci/TraceFoxBotCredentialStore.swift tests/bot-keychain-main.swift -o "$RUNNER_TEMP/bot-keychain-test"
          "$RUNNER_TEMP/bot-keychain-test"
      - name: Test account-bound pairing attempts without sending messages
        run: |
          swiftc ci/TraceFoxBotLinkProtocol.swift ci/TraceFoxBotPairingAttempt.swift tests/bot-pairing-main.swift -o "$RUNNER_TEMP/bot-pairing-test"
          "$RUNNER_TEMP/bot-pairing-test"
      - name: Test bot claim HTTP client with URLProtocol fixtures
        run: |
          swiftc ci/TraceFoxBotLinkProtocol.swift ci/TraceFoxBotPairingAttempt.swift ci/TraceFoxCloudArchiveIdentity.swift ci/TraceFoxCloudArchivePayload.swift ci/TraceFoxBotLinkClient.swift ci/TraceFoxBotCredentialStore.swift ci/TraceFoxBotPairingCoordinator.swift tests/bot-http-main.swift -o "$RUNNER_TEMP/bot-http-test"
          "$RUNNER_TEMP/bot-http-test"
      - name: Compile and test independent archive storage
        run: |
          swiftc ci/TraceFoxArchiveStore.swift tests/archive-store-main.swift -o "$RUNNER_TEMP/archive-store-test"
          "$RUNNER_TEMP/archive-store-test"
      - name: Test actual archive bridge with host API fixtures
        run: |
          swiftc -emit-module -emit-library -module-name Postbox tests/archive-fixtures/Postbox.swift -emit-module-path "$RUNNER_TEMP/Postbox.swiftmodule" -o "$RUNNER_TEMP/libPostbox.dylib"
          swiftc -I "$RUNNER_TEMP" -L "$RUNNER_TEMP" -lPostbox ci/TraceFoxArchiveStore.swift ci/TraceFoxLocalArchive.swift tests/archive-fixtures/TelegramTypes.swift tests/archive-bridge-main.swift -o "$RUNNER_TEMP/archive-bridge-test"
          DYLD_LIBRARY_PATH="$RUNNER_TEMP" "$RUNNER_TEMP/archive-bridge-test"
      - name: Test privacy policy and per-account persistence
        run: |
          swiftc ci/TraceFoxPrivacyPolicy.swift ci/TraceFoxPrivacyRuntime.swift tests/archive-fixtures/Network.swift tests/privacy-policy-main.swift -o "$RUNNER_TEMP/privacy-policy-test"
          "$RUNNER_TEMP/privacy-policy-test"
      - name: Test actual privacy control with synchronous API fixtures
        run: |
          swiftc -emit-module -emit-library -module-name SwiftSignalKit tests/archive-fixtures/SwiftSignalKit.swift -emit-module-path "$RUNNER_TEMP/SwiftSignalKit.swiftmodule" -o "$RUNNER_TEMP/libSwiftSignalKit.dylib"
          swiftc -emit-module -emit-library -module-name TelegramApi tests/archive-fixtures/TelegramApi.swift -emit-module-path "$RUNNER_TEMP/TelegramApi.swiftmodule" -o "$RUNNER_TEMP/libTelegramApi.dylib"
          swiftc -D CONTROL_TEST -I "$RUNNER_TEMP" -L "$RUNNER_TEMP" -lSwiftSignalKit -lTelegramApi ci/TraceFoxPrivacyPolicy.swift ci/TraceFoxPrivacyRuntime.swift ci/TraceFoxPrivacyControl.swift tests/archive-fixtures/Network.swift tests/privacy-control-main.swift -o "$RUNNER_TEMP/privacy-control-test"
          DYLD_LIBRARY_PATH="$RUNNER_TEMP" "$RUNNER_TEMP/privacy-control-test"
